# Continuous integration.
#
# Ships with the first commit of code, deliberately (docs/phase-0/03 §6).
# The existing Universitio repository has no CI and no automated tests; adding
# checks to an empty repository costs an hour, whereas retrofitting them onto a
# grown codebase never gets prioritised. This system submits university
# applications, so a regression does not show a wrong image — it submits a wrong
# application, or submits twice.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Boundaries · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile: CI must fail if the lockfile is stale rather than
        # silently resolving different versions than a developer tested with.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # Not merely a type check. The ADR-0004 guarantee — that model-generated
        # text cannot reach a form field — is enforced by the compiler, and the
        # @ts-expect-error assertions in values.test.ts are compile-time tests.
        # If someone adds a conversion path from ModelText to ConfirmedValue,
        # those directives become unused and THIS STEP FAILS.
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Dependency boundaries
        # Enforces that the domain core stays pure, and that browser-runner
        # never gains access to the case store, profile, documents or secrets
        # (brief §8).
        run: pnpm run boundaries

      - name: Retention schedule
        # A half-configured retention schedule is the dangerous state, because
        # it LOOKS configured. This validates the schedule's internal
        # consistency and fails on a placeholder basis, a contradiction, or a
        # policy past its review date (ADR-0010, ADR-0023).
        run: pnpm run retention-status

      - name: Install Chromium for the browser runtime
        # apps/browser-runner tests the read-only guard against real Chromium
        # (ADR-0014). Asserting that property in a comment is not enough — a
        # portal's own JavaScript is what the guard exists to stop.
        # Scoped to the workspace package: playwright is a dependency of
        # apps/browser-runner, not of the root, so `pnpm exec` from the root
        # cannot resolve it.
        run: pnpm --filter @askimate/aas-browser-runner exec playwright install --with-deps chromium

      - name: Tests
        run: pnpm run test

  # Enabled 2026-08-27, when the case store gained its Postgres adapter.
  #
  # Two suites need a real database, and both need it for the same reason: the
  # guarantee under test is enforced by something the database does, so a fake
  # would be re-implementing the thing being tested.
  #
  #   packages/case-store    optimistic concurrency and duplicate-submission
  #                          prevention are PRIMARY KEY constraints
  #   apps/chat-integration  "the password reaches no column of any row" is
  #                          only meaningful against real rows
  #
  # AAS_REQUIRE_DATABASE=1 turns a skip into a failure. Without it, a CI run
  # with a broken Postgres service would report green while checking nothing.
  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        # apps/chat-integration drives the secure control in a real browser.
        run: pnpm --filter @askimate/aas-browser-runner exec playwright install --with-deps chromium

      # The WHOLE suite, not a list of paths.
      #
      # This used to name three directories. A list is a thing that goes stale:
      # a new database-backed suite added anywhere else would never have run
      # here, and nothing would have said so — the job would stay green while
      # covering less and less. Running everything means there is no list to
      # forget to update.
      #
      # AAS_REQUIRE_DATABASE=1 turns `announceSkip` from a warning into a
      # throw, so a broken or missing Postgres service fails this job instead
      # of quietly reporting green over tests that never executed.
      # `scripts/ci-guard.test.ts` asserts both of those facts about this file,
      # so removing them turns the default test run red.
      - name: Integration tests
        run: pnpm exec vitest run
        env:
          AAS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aas_test
          AAS_REQUIRE_DATABASE: "1"
