<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Postgraduate Application — Personal details</title></head>
<body>
<h1>Postgraduate Application</h1>

<!--
  A fixture for preparation-mode tests.

  Deliberately carries BOTH an advance control and a submission control on the
  same page, because that is where the interesting failure lives: a run that
  fills the form correctly and then clicks the wrong button.
-->

<form action="/apply/save" method="post" id="applicationForm">
  <label for="givenName">First name</label>
  <input type="text" id="givenName" name="given_name" required maxlength="50">

  <label for="familyName">Last name</label>
  <input type="text" id="familyName" name="family_name" required maxlength="50">

  <label for="dob">Date of birth</label>
  <input type="text" id="dob" name="date_of_birth" required pattern="\d{2}/\d{2}/\d{4}">

  <label for="nationality">Nationality</label>
  <select id="nationality" name="nationality" required>
    <option value="">Please select</option>
    <option value="GB">United Kingdom</option>
    <option value="IR">Iran</option>
  </select>

  <label for="passportCountry">Country that issued your passport</label>
  <select id="passportCountry" name="passport_country" required>
    <option value="">Choose a nationality first</option>
  </select>

  <label for="birthCountry">Country of birth</label>
  <input type="text" id="birthCountry" name="birth_country" autocomplete="off">
  <ul id="birthCountryOptions" role="listbox"></ul>
  <input type="hidden" id="birthCountryCode" name="birth_country_code" value="">

  <label for="passport">Passport photo page</label>
  <input type="file" id="passport" name="passport" accept=".pdf,.jpg">

  <!-- P110: a yes-or-no group that SUBMITS "yes" and "no" as its values, "no" first —
       Sheffield's nationality.do has twelve of these. -->
  <fieldset id="livedOutside">
    <legend>Have you lived outside your country of nationality?</legend>
    <input type="radio" id="livedOutsideNo" name="lived_outside" value="no"><label for="livedOutsideNo">No</label>
    <input type="radio" id="livedOutsideYes" name="lived_outside" value="yes"><label for="livedOutsideYes">Yes</label>
  </fieldset>
  <input type="radio" id="agreeTerms" name="agree_terms" value="agreed"><label for="agreeTerms">I agree</label>

  <label for="declaration">I declare that the information given is true and complete</label>
  <input type="checkbox" id="declaration" name="declaration">

  <button type="button" id="continueBtn">Save and continue</button>
  <button type="submit" id="submitBtn">Submit application</button>
</form>

<script>
  // P94: a list the page fills by script once another field is set, after a
  // round trip — the education chain's shape on the first real form. Nothing
  // is offered until the nationality is chosen, and then not at once.
  document.getElementById("nationality").addEventListener("change", function (event) {
    var list = document.getElementById("passportCountry");
    var chosen = event.target.value;
    setTimeout(function () {
      list.innerHTML = "";
      // A blank first entry, as real lists have: nothing is chosen until
      // someone chooses, so a read-back after a refused wait says "".
      var offered = chosen === "IR" ? [["", "Please select"], ["IR", "Iran"], ["XX", "Another country"]]
        : chosen === "GB" ? [["", "Please select"], ["GB", "United Kingdom"], ["XX", "Another country"]] : [];
      offered.forEach(function (pair) {
        var option = document.createElement("option");
        option.value = pair[0];
        option.textContent = pair[1];
        list.appendChild(option);
      });
    }, 400);
  });

  // P95: a typeahead. Entries appear as the applicant types, after a pause;
  // choosing one puts its text in the box. Two entries share a prefix on
  // purpose, so "Ira" offers two and "Iran" offers one.
  //
  // P101: each entry carries, as Tom Select's do on the first real form, a
  // `data-value` the form submits that is NOT the visible text ("IRAN" against
  // "Iran"; "MYANMAR" against a long label), a `data-selectable` mark, and a
  // class that changes with state ("option", "option selected",
  // "option active"). The runner matches an entry by what it reads, and a
  // class is never part of the locator.
  (function () {
    // "Ireland" twice, as a real list can repeat an entry: two exact matches
    // choose nothing (P97).
    var COUNTRIES = [
      ["IRAN", "Iran", "option selected"],
      ["IRAQ", "Iraq", "option"],
      ["IRELAND", "Ireland", "option"],
      ["IRELAND-2", "Ireland", "option active"],
      ["ITALY", "Italy", "option"],
      ["MYANMAR", "Myanmar (Burma) [The Republic of the Union of Myanmar]", "option"],
      ["UNITED KINGDOM", "United Kingdom", "option"],
      // P102: the escape the first real form's institution list ends with.
      ["NOT-IN-LIST", "Not in list", "option"]
    ];
    var box = document.getElementById("birthCountry");
    var list = document.getElementById("birthCountryOptions");
    var code = document.getElementById("birthCountryCode");
    box.addEventListener("input", function () {
      var typed = box.value.toLowerCase();
      setTimeout(function () {
        list.innerHTML = "";
        if (typed.length === 0) return;
        COUNTRIES.filter(function (c) { return c[1].toLowerCase().indexOf(typed) === 0; }).forEach(function (c) {
          var entry = document.createElement("li");
          entry.setAttribute("role", "option");
          entry.setAttribute("data-selectable", "");
          entry.setAttribute("data-value", c[0]);
          entry.className = c[2];
          entry.textContent = c[1];
          entry.addEventListener("click", function () {
            box.value = c[1];
            box.setAttribute("data-chosen", c[1]);
            code.value = c[0];
            list.innerHTML = "";
          });
          list.appendChild(entry);
        });
      }, 300);
    });
  })();

  // A portal that saves a draft as the applicant types. Preparation must
  // permit this — blocking it would block the work — and must record it.
  document.getElementById("continueBtn").addEventListener("click", function () {
    fetch("/apply/save", { method: "POST", body: "{}" });
    document.title = "SAVED";
  });
</script>
</body>
</html>
