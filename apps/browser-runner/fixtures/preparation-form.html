<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Postgraduate Application — Personal details</title></head>
<body>
<h1>Postgraduate Application</h1>

<!--
  A fixture for preparation-mode tests.

  Deliberately carries BOTH an advance control and a submission control on the
  same page, because that is where the interesting failure lives: a run that
  fills the form correctly and then clicks the wrong button.
-->

<form action="/apply/save" method="post" id="applicationForm">
  <label for="givenName">First name</label>
  <input type="text" id="givenName" name="given_name" required maxlength="50">

  <label for="familyName">Last name</label>
  <input type="text" id="familyName" name="family_name" required maxlength="50">

  <label for="dob">Date of birth</label>
  <input type="text" id="dob" name="date_of_birth" required pattern="\d{2}/\d{2}/\d{4}">

  <label for="nationality">Nationality</label>
  <select id="nationality" name="nationality" required>
    <option value="">Please select</option>
    <option value="GB">United Kingdom</option>
    <option value="IR">Iran</option>
  </select>

  <label for="passportCountry">Country that issued your passport</label>
  <select id="passportCountry" name="passport_country" required>
    <option value="">Choose a nationality first</option>
  </select>

  <label for="passport">Passport photo page</label>
  <input type="file" id="passport" name="passport" accept=".pdf,.jpg">

  <label for="declaration">I declare that the information given is true and complete</label>
  <input type="checkbox" id="declaration" name="declaration">

  <button type="button" id="continueBtn">Save and continue</button>
  <button type="submit" id="submitBtn">Submit application</button>
</form>

<script>
  // P94: a list the page fills by script once another field is set, after a
  // round trip — the education chain's shape on the first real form. Nothing
  // is offered until the nationality is chosen, and then not at once.
  document.getElementById("nationality").addEventListener("change", function (event) {
    var list = document.getElementById("passportCountry");
    var chosen = event.target.value;
    setTimeout(function () {
      list.innerHTML = "";
      // A blank first entry, as real lists have: nothing is chosen until
      // someone chooses, so a read-back after a refused wait says "".
      var offered = chosen === "IR" ? [["", "Please select"], ["IR", "Iran"], ["XX", "Another country"]]
        : chosen === "GB" ? [["", "Please select"], ["GB", "United Kingdom"], ["XX", "Another country"]] : [];
      offered.forEach(function (pair) {
        var option = document.createElement("option");
        option.value = pair[0];
        option.textContent = pair[1];
        list.appendChild(option);
      });
    }, 400);
  });

  // A portal that saves a draft as the applicant types. Preparation must
  // permit this — blocking it would block the work — and must record it.
  document.getElementById("continueBtn").addEventListener("click", function () {
    fetch("/apply/save", { method: "POST", body: "{}" });
    document.title = "SAVED";
  });
</script>
</body>
</html>
