# ═══════════════════════════════════════════════════════════════════════════
# The Conversation Service — Plane A.
#
# ADR-0005 (contract first), ADR-0030 (origins), ADR-0031 (the event log),
# ADR-0033 (cookies), ADR-0035 (SSE), ADR-0036 (no third-party scripts).
#
# THE PROPERTY THIS DOCUMENT EXISTS TO MAKE CHECKABLE:
#   No schema in this file has a field that can hold a secret. Not the request
#   bodies, not the responses, not the events, not the errors. A password
#   cannot reach this service, because there is no endpoint that accepts one
#   and no field that could carry one. `openapi.test.ts` asserts it by walking
#   every schema in this document rather than by trusting this comment.
# ═══════════════════════════════════════════════════════════════════════════
openapi: 3.1.0
info:
  title: AskiMate Conversation Service
  version: "1.0.0"
  description: >-
    The conversation plane. Owns students, conversations, the append-only event
    log and message bodies. Never receives, stores, forwards or logs a secret
    value; the only thing it learns about a secure step is which request it was,
    what lifecycle it reached, and an opaque single-use handle.
  license: { name: UNLICENSED }

servers:
  # ── The ORIGIN, not a versioned base ──────────────────────────────────
  #
  # It was `…/v1`, and the document then mixed two conventions under it: the
  # student paths were written WITHOUT `/v1` (correct against that base) while
  # the internal ones carried their own `/internal/v1` and resolved to
  # `…/v1/internal/v1/…`, which nothing serves. `/healthz` is at the root and
  # could not be expressed at all.
  #
  # So the base is the origin and every path below is literally the path the
  # process serves — the same shape `secure.v1.yaml` already uses. That is
  # also what lets `contract-drift.test.ts` compare this document against the
  # real Express router mechanically rather than by eye (ADR-0063).
  - url: https://app.askimate.com
    description: Production
  - url: https://app.staging.askimate.com
    description: Staging

security:
  - conversationSession: []

tags:
  - name: conversations
  - name: events
  - name: messages

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [conversations]
      summary: Liveness. The only unauthenticated endpoint.
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /v1/conversations:
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a conversation.
      description: >-
        The first step of the student journey. No request body: a conversation
        is opened, not described.

        `Idempotency-Key` is optional and is a pure REPLAY guard here — with no
        body, two requests carrying one key cannot disagree, so there is no
        conflict to report and no 409 on this operation. Without a key, a
        retried create leaves a second empty conversation, which is untidy and
        not consequential: an empty conversation has no case, no run and
        nothing typed.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201":
          description: Created.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Conversation" } }
        "200":
          description: >-
            A replay. The `Idempotency-Key` had already opened this
            conversation, so the same one is returned rather than a second
            empty one being created.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Conversation" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: listConversations
      tags: [conversations]
      summary: The caller's conversations, newest first.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 } }
        - { name: limit, in: query, required: false,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConversationPage" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/conversations/{conversationId}:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      operationId: getConversation
      tags: [conversations]
      responses:
        "200":
          description: The conversation.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Conversation" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        # Deliberately 404 and not 403 for a conversation belonging to someone
        # else. A 403 confirms the conversation exists, which is a fact about
        # another student.
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/secure-origin:
    get:
      operationId: readSecureOrigin
      tags: [secure]
      summary: Where the secure plane is. A location, never a capability.
      description: >-
        ADR-0100. The page decides whether it can show a secure step BEFORE it
        asks for the bootstrap capability, and one of the three things that
        decision turns on is whether the secure origin answers. It cannot probe
        an origin it has not been told, and the bootstrap — the only other
        route that names it — is the mint. Before this read existed, a page
        that could not show the step minted a token for a frame that never
        mounted.

        Nothing is minted and nothing is stored. The origin is the same one the
        bootstrap answers with and the frame is loaded from; it is not a
        secret, and this route is authenticated only because everything on a
        student's journey is.
      responses:
        "200":
          description: The secure plane's origin.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [secureOrigin]
                properties:
                  secureOrigin:
                    type: string
                    format: uri
                    description: The origin the secure frame is served from.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503":
          description: This deployment has no secure plane wired to it.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/conversations/{conversationId}/secure-requests/{requestId}/bootstrap:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - name: requestId
        in: path
        required: true
        schema: { type: string }
        description: >-
          The OPEN secure request in this conversation's own log. An identifier,
          not a capability: naming somebody else's request answers 404, because
          the service checks the id against this conversation before it mints
          anything.
    get:
      operationId: bootstrapSecureStep
      tags: [secure]
      summary: The capability that lets this page start the secure frame.
      description: >-
        ADR-0033. PUBLISHED IN P27, having been served since P4 with no schema
        at all — the one public, session-authenticated route this document did
        not describe.

        The token is delivered in a RESPONSE BODY over an authenticated
        same-origin fetch, never in a URL, where it would reach the Referer
        header, browser history, an access log and any shared screenshot.

        Three checks before it is minted: the caller owns the conversation, the
        request is open IN THIS CONVERSATION'S OWN LOG, and the secure service
        still considers it live. The middle one is what stops a student asking
        for a bootstrap into somebody else's secure step by naming its id.

        Nothing is stored: the conversation plane asks the Secure Interaction
        Service at the moment a page mounts the frame and hands the answer
        straight on. A capability at rest here would be a capability in the one
        plane ADR-0037 keeps free of them.
      responses:
        "200":
          description: A single-use capability, and where to send it.
          headers:
            Cache-Control:
              schema: { type: string, enum: ["no-store"] }
              description: >-
                A capability in a cache is a capability that outlives the page
                that asked for it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecureStepBootstrap" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: >-
            No such open request in this conversation, or the secure service no
            longer considers it live. Deliberately the same answer for both, and
            for a request belonging to somebody else.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "503":
          description: This deployment has no secure plane wired to it.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/conversations/{conversationId}/events:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      operationId: listConversationEvents
      tags: [events]
      summary: The transcript, from an ordinal. First load and backfill.
      description: >-
        Returns events with `ordinal > after`, ascending. The same projection the
        SSE stream sends, so there is one correctness argument rather than two.
      parameters:
        - name: after
          in: query
          required: false
          description: Exclusive lower bound. Omit for the whole conversation.
          schema: { type: integer, minimum: 0 }
        - { name: limit, in: query, required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: A page of events in ordinal order.
          content:
            application/json: { schema: { $ref: "#/components/schemas/EventPage" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/conversations/{conversationId}/stream:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      operationId: streamConversationEvents
      tags: [events]
      summary: Server-Sent Events, resumable by ordinal.
      description: >-
        Each frame carries `id: <ordinal>`, so a dropped connection resumes with
        the browser's own `Last-Event-ID` header and the server continues from
        that ordinal. A `conversation.resume` frame is sent first, naming the
        ordinal the stream is resuming after, so a client can detect a gap and
        backfill over /events rather than render a conversation with a hole.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            The last ordinal the client received. Client-supplied and therefore
            untrusted: parsed as a strict non-negative integer and used only as
            a lower bound within a conversation already authorised.

            Sent by the browser AUTOMATICALLY, and only on a reconnect of an
            EventSource that has already received a frame. A page that has just
            loaded cannot send it: EventSource takes no headers.
          schema: { type: string, pattern: "^[0-9]+$" }
        - name: lastEventId
          in: query
          required: false
          description: >-
            The same lower bound, for the case the header cannot cover: a FRESH
            EventSource after a page refresh. The browser API sets no request
            headers, so a client that already holds events up to ordinal 41 has
            no way to say so on its first connection — and a stream that
            restarted from 0 on every refresh would re-send the whole
            conversation, and would announce `resumingAfter: 0`, which is not
            what the client needs resuming after.

            The header WINS when both are present: it is the browser's own
            account of what it actually received on this connection, whereas the
            query parameter is what the page believed before the connection
            existed.

            Parsed and constrained identically — a strict non-negative integer,
            used only as a lower bound inside a conversation already authorised,
            so it can no more widen a query than the header can.
          schema: { type: string, pattern: "^[0-9]+$" }
      responses:
        "200":
          description: An event stream.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Accel-Buffering:
              description: Disables proxy buffering, which would batch a live stream.
              schema: { type: string, const: "no" }
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/conversations/{conversationId}/messages:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send an ordinary message. Fail-closed while a secure step is open.
      description: >-
        The guard runs BEFORE the body is read for any purpose. There is
        deliberately no branch in which the text is pulled out of the body, held
        in a variable and then discarded: on the refused path the value never
        enters scope. A refusal names the OPEN REQUEST and never anything from
        the body, because an echo is how a refused password reaches a log.

        The reply is not in this response. The model answers asynchronously and
        its message arrives as an event on the stream.

        The response is the EVENT the server wrote, at the ordinal the server
        assigned inside the same transaction as the insert. There is no field
        through which a client could propose a position and none through which
        one is echoed back: a client learns where its message went, it does not
        say.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyRequired" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "200":
          description: >-
            An idempotent retry. The write already happened; this is the same
            event at the same ordinal, which is what makes the retry safe to
            repeat. A retry must not append a second copy, so it cannot be a
            201 — the status is how a client tells the two apart.
          content:
            application/json: { schema: { $ref: "#/components/schemas/MessageEvent" } }
        "201":
          description: Accepted and appended. The event, as it was written.
          content:
            application/json: { schema: { $ref: "#/components/schemas/MessageEvent" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SecretRequestOpen" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/application-targets:
    get:
      operationId: listApplicationTargets
      tags: [runs]
      summary: The reviewed application targets this system can execute against.
      description: >-
        GATE 1 (ADR-0058). A read-only view over artefacts an approval registry
        already vouched for.

        P20's loader runs `checkExecutable` and `checkUsable` on every entry and
        refuses to START if any fails, so this list cannot contain an
        unreviewed, retired, superseded or unusable target. Listing an approved
        artefact neither creates nor implies approval, and there is no second
        unreviewed catalogue for a target to arrive from.

        Authenticated: it is part of a student's journey, and an anonymous
        reader could otherwise enumerate this system's institutional
        relationships.
      responses:
        "200":
          description: Every target a student may be offered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationTargetList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503":
          description: No catalogue is resolved, so nothing can be offered.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ═══════════════════════════════════════════════════════════════════════
  # The document transport (ADR-0090) — B4, open since ADR-0067 §8
  # ═══════════════════════════════════════════════════════════════════════
  #
  # TWO STEPS, and the split is the control. The declaration runs the storage
  # gates; only then does a route exist that will read a body. A refusal that
  # arrives after a passport has crossed the wire has already failed.
  /v1/conversations/{conversationId}/documents:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      operationId: listHeldDocuments
      tags: [documents]
      summary: What this student holds, and the types they can be given.
      description: >-
        Per STUDENT, reached through a conversation they own: documents are
        held for reuse across applications (B5, ADR-0078), so the list is the
        same from every conversation of theirs. The page draws its document
        panel from this read and nothing else — a reload shows the same list
        because the list was never the page's to keep (ADR-0060).
      responses:
        "200":
          description: The documents held, newest last, and the types the schedule names.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeldDocuments" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: No document store is configured.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      operationId: declareDocumentUpload
      tags: [documents]
      summary: Declare a document you are about to send. Runs the storage gates.
      description: >-
        Runs the retention gate (ADR-0010, ADR-0023) and the lawful-basis gate
        (ADR-0022, ADR-0087) on the DECLARATION, before any body exists. On
        success it answers with a pre-signed upload — the URL the browser PUTs
        the bytes to, straight to the bucket, and the headers the bucket
        refuses the PUT without — plus the exact constraints: the byte
        ceiling, the accepted content types and the hash the bytes must match.
        The bytes never pass through this service (ADR-0092); the upload URL
        binds them to the declared hash (ADR-0093), and the bucket enforces it.


        A 403 means a gate refused, and its `detail` is the gate's own words:
        which document type, which activity, and what is missing. A 400 on
        `/documentType` means the type is not one this system supports —
        `national_id` was removed in ADR-0089.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUploadDeclaration" }
      responses:
        "201":
          description: The gates passed. PUT the bytes to `upload.url` with `upload.headers`, then confirm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentIntake" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A storage gate refused. The detail names which, and why.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: The declared size is over this document type's ceiling.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          description: This document type may not arrive as that content type.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: No document store is configured, so nothing can be supplied.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/conversations/{conversationId}/documents/{intakeId}/confirm:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: intakeId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: confirmDocumentUpload
      tags: [documents]
      summary: Confirm the bytes reached the bucket. Once.
      description: >-
        The bytes went from the browser to the bucket on the declaration's
        pre-signed upload; they never passed through this service (ADR-0092).
        This route asks the bucket what it holds for the intake and records
        the document only if it is exactly what was declared — the checksum
        the bucket enforced, the length, and encryption under the
        customer-managed key. The browser's word that the upload happened is
        not taken.


        No request body. An intake is spent once, by this call: a second
        confirm, an expired intake and an id nobody opened all answer
        `intake_not_open`, deliberately indistinguishable. A confirm that
        finds nothing in the bucket answers `upload_not_received` and has
        still spent the intake — declare the document again, and the checks
        that permit it re-run.
      responses:
        "201":
          description: Recorded. The document exists, in the bucket, under the key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredDocument" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `intake_not_open` — spent, expired or never opened. Or
            `upload_not_received` — the bucket holds nothing for it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: >-
            `content_hash_mismatch` — the bucket holds an object for this
            upload whose checksum or length is not the declared one. Nothing
            is recorded.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: >-
            No document store is configured, or the object is not encrypted
            under the customer-managed key. Nothing is recorded.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/conversations/{conversationId}/target-offers:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      operationId: createTargetOffer
      tags: [runs]
      summary: Put a chosen reviewed target to the student, deterministically.
      description: >-
        NOT consequential. No case, no run, nothing the student is committed
        to — what it produces is an offer: a deterministic rendering of exactly
        what would be applied for, and the hash a later explicit request must
        name.

        `blueprintId` here is a LOOKUP KEY, not an authority. Every field of the
        offer is taken from the catalogue entry it resolves to, so a client
        sending a different id receives a different offer rather than one it
        authored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTargetOfferRequest" }
      responses:
        "201":
          description: The offer, its rendering, and the hash to accept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetOffer" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: >-
            No reviewed target with that id, or the conversation is not this
            student's. One answer for both, so a probe cannot tell them apart.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: >-
            Several reviewed targets share this institution, course and intake
            and differ by route. A SAFETY refusal: the submission key does not
            include the blueprint, so applying through one permanently rules out
            the others for this student. The student disambiguates; the server
            never picks a default.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: No catalogue is resolved, so nothing can be offered.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/conversations/{conversationId}/runs:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      operationId: readConversationRun
      tags: [runs]
      summary: Where the application has got to, without acting on it.
      description: >-
        ADR-0060, ADR-0061. A READ: it does not advance the run, append an
        event or write a checkpoint.

        `pending` says what the run is waiting for the student to DO, and the
        hash that decision must carry — sourced from exactly what the decision
        route validates against, so a client never computes one. `null` when
        the run is working and nothing is being asked of them.

        It exists so a client never has to keep its own copy of where the
        journey stands. Before it, `POST .../runs` was the only way to learn a
        run's position and it requires an `offerHash` — so a client that
        reloaded had to hold the run id, the step and the offer hash in browser
        storage, which would make it a durable holder of workflow identity.

        `run` is `null` when this conversation has not started one. That is a
        real answer and a different fact from 404, which is reserved for a
        conversation that is not yours.
      responses:
        "200":
          description: The run, or null.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [run, pending]
                properties:
                  run:
                    oneOf:
                      - $ref: "#/components/schemas/ConversationRun"
                      - type: "null"
                  pending:
                    oneOf:
                      - $ref: "#/components/schemas/PendingDecision"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: This deployment carries no run driver.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    post:
      operationId: startRun
      tags: [runs]
      summary: Start the application run this conversation owns, or resume it.
      description: >-
        The student's starting action. It binds a case to the conversation,
        starts a durable workflow run against it, and asks the orchestrator what
        happens next. The Conversation Service COORDINATES; the orchestrator
        DECIDES — nothing on this endpoint chooses a step.

        There is no Idempotency-Key, and that is not an oversight. A conversation
        owns AT MOST ONE case — a partial unique index and a composite foreign
        key say so — so a client retrying a timed-out start is asking the same
        question rather than making a second request. `resumed` and the status
        code are how a caller tells which it got.

        `studentStatement` is required because a case cannot be opened without
        request evidence: explicit request before consequential action, and
        silence is not consent. It is what the student actually said, so that
        "why did you apply to this for this student?" has their own sentence as
        its answer.

        Note what the response does NOT carry: nothing a step SAID. Prompts,
        previews, plans and violation lists stay out of it, and a client that
        needs the student's next question reads the conversation log — the one
        place a student-visible sentence is durable and ordered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRunRequest" }
      responses:
        "200":
          description: >-
            The conversation already had a run; this is where it stands now,
            after one further decision. `resumed` is true.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConversationRun" } }
        "201":
          description: A run was created for this conversation.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConversationRun" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: >-
            The case cannot be bound here — it belongs to a different student, or
            another conversation already owns it. Refused by the database's
            composite foreign key, not by a check in a handler.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "404":
          description: >-
            The conversation is not this student's, or the offer hash names
            nothing this server offered them here. DELIBERATELY the same answer
            to both, so a probe cannot tell "wrong owner" from "no such offer".
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "409":
          description: >-
            Two different facts, told apart by `code`.

            `content_changed` — the offer WAS made in this conversation and no
            longer describes an available target: it was retired, or the
            reviewed content behind it changed. A fresh offer is needed;
            nothing about this is recoverable by retrying.

            `already_applying` — this student already has an application for
            this institution, course and intake (ADR-0006). The submission
            identity is claimed, and a second case for it would be the duplicate
            submission the brief calls the characteristic catastrophic failure
            of this class of system. The body names the case that holds it and
            whether it has concluded; a concluded one may be re-applied to
            through `POST .../reapplication`.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/AlreadyApplyingProblem"
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: >-
            This deployment carries no run driver, no target directory, or the
            blueprint's mapping set is not usable. A deployment with no
            directory could not have made an offer, so it refuses rather than
            skipping the gate. The second is a specialist's problem and its detail
            names fields of a university's form, so the detail stays out of the
            body.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/conversations/{conversationId}/reapplication/prior-outcome:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      operationId: statePriorOutcome
      tags: [runs]
      summary: Say what happened to the previous application, and be advised.
      description: >-
        The FIRST half of ADR-0006's re-application exchange, and the reason
        there are two halves rather than one: the wait recommendation is
        advisory in effect and MANDATORY in presentation. The system must show
        it before accepting an instruction, and must record that it did. This
        is the showing; `POST .../reapplication` is refused without it.

        The student sends what they say happened and nothing else. The advice is
        composed by the server, so there is no field through which a client
        could claim to have shown advice nobody gave. `priorOutcome` is a CLAIM
        — MVP responsibility ends at submission confirmation and there is no
        journey tracking, so this system does not know of its own accord that an
        application was rejected.

        The target is not a parameter. This conversation reached here by asking
        to apply and being refused, and the binding records which application
        that was.

        It appends two events to the conversation: `reapplication_advised`, the
        structured record, and the assistant message the student reads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [priorOutcome]
              properties:
                priorOutcome: { $ref: "#/components/schemas/PriorOutcome" }
      responses:
        "200":
          description: What we advised, and when we said it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/WaitRecommendation" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: >-
            The conversation is not this student's, or they have no application
            for this target at all. The same answer to both.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: This deployment carries no run driver.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/conversations/{conversationId}/reapplication:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      operationId: instructReapplication
      tags: [runs]
      summary: Instruct a second application, in the student's own words.
      description: >-
        The SECOND half. ADR-0006: "the decision to re-apply belongs to the
        student", and nothing else may create an attempt — not a retry, not a
        specialist, not an operator.

        A re-application opens a NEW case that references the prior one, not a
        new attempt ordinal on a concluded case. A second attempt is genuinely a
        different application — different intake, different deadline, possibly
        changed entry requirements, and a separate authorisation — and one case
        holding two of each could not state precisely what the student agreed
        to. Since a conversation owns at most one case, the new case lives in
        THIS conversation, which is where the student already is.

        The request carries the statement and nothing else. Not the prior case:
        the submission-key chain says which application this target already has.
        Not the attempt ordinal: the domain derives it. Not the outcome or the
        recommendation: both are read back from the advice event this
        conversation's log holds. Every one of those would have been a field a
        caller could disagree with the system about, on the one number ADR-0006
        says may only increase by one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [studentStatement]
              properties:
                studentStatement:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: >-
                    What the student actually said. Not a boolean: when somebody
                    asks "why was a second application sent?", the answer should
                    be their own sentence.
      responses:
        "200":
          description: This conversation already had a run; `resumed` is true.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConversationRun" } }
        "201":
          description: A second application was opened, and its run started.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConversationRun" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: >-
            The domain refused the instruction — the prior application has not
            concluded, the statement is empty, the recommendation was shown
            after the fact, or that application already led to a second one. The
            reason names a case and quotes a rule, so it stays out of the body.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "404":
          description: >-
            The conversation is not this student's, or they have no application
            for this target to re-apply to.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "409":
          description: >-
            `content_changed` — the wait recommendation was never shown in this
            conversation. The remedy is the first half of the exchange: ask the
            student what happened and let the system advise.

            `already_applying` — the attempt this instruction derived is already
            claimed, which means another request opened it in between.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/AlreadyApplyingProblem"
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: This deployment carries no run driver.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/conversations/{conversationId}/runs/{runId}/preview:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - { $ref: "#/components/parameters/RunId" }
    get:
      operationId: readRunPreview
      tags: [runs]
      summary: Exactly what will be submitted, for the student to read.
      description: >-
        ADR-0059. The application as it stands, rendered for the person who has
        to approve it, with the hash their approval will name.

        `presentedText` and `contentHash` come from ONE reading of the
        orchestrator's authorisation step, so what is displayed and what is
        authorised cannot come from two different renderings.

        A PROJECTION, never a stored message. The preview holds the student's
        data in plain text because that is its purpose — it exists to be read
        and checked — and it must not reach a log, an event, a trace or an audit
        record. It is computed for this request, served `no-store`, and written
        nowhere. It also cannot go stale: the decision below compares the hash
        against the preview the orchestrator would render at that moment, so a
        copy stored earlier would be read by a student whose approval is then
        refused for a mismatch they cannot see.
      responses:
        "200":
          description: The application, as it will be sent.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json: { schema: { $ref: "#/components/schemas/RunPreview" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: >-
            No such conversation for this student, no such run, or this run is
            not asking for an authorisation. DELIBERATELY one answer: a client
            able to tell them apart could probe which of another student's runs
            exist, and a student has nothing to do differently in either case.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "503":
          description: This deployment carries no run driver.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/conversations/{conversationId}/runs/{runId}/decision:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - { $ref: "#/components/parameters/RunId" }
    post:
      operationId: recordStudentDecision
      tags: [runs]
      summary: A decision only the student can make.
      description: >-
        ADR-0049 §5. `authorise`, `confirm_handoff` and `confirm_value` each
        carry the hash of exactly what the student was shown; `cancel` carries
        none, because requiring one would mean a student could stop only
        immediately after the system had spoken (ADR-0053).

        The hash is compared against what the orchestrator would render NOW, and
        a mismatch is refused rather than recorded: an authorisation of content
        that has since changed is what the void-and-re-ask path exists to catch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentDecision" }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Two answers, told apart by `code`.

            `content_changed` — the hash does not name what would be shown now.
            Re-render and ask again; retrying the same hash would be asking the
            service to record an approval of content the student never saw.

            `specialist_reviewing` — a person is checking part of this
            application, so it cannot be advanced yet (P40). The state clears
            itself when they finish, and the student was told about it in the
            conversation when it started. Refuses `authorise` and
            `confirm_handoff`, the two decisions that MOVE an application;
            `cancel` is never refused for being ill-timed (ADR-0053) and
            `confirm_value` is an answer about the student's own details rather
            than an advance.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: This deployment carries no run driver.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /internal/v1/cases/{caseId}/review:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: completeReview
      tags: [internal]
      security: [{ serviceMutualTls: [] }]
      summary: A specialist records the outcome of a mandatory review.
      description: >-
        ADR-0048, ADR-0049 §4. PUBLISHED IN P27, having been served since P11.

        Shipped alongside trigger-raising because raising a mandatory trigger
        with no way to clear it would deadlock every case involving a minor or
        money — a worse failure than the one being fixed.

        `reviewerId` is ASSERTED, not authenticated: the service admits this
        call on the internal service credential, so this records who CLAIMED to
        review it. Vahid approved that for the current single-operator model and
        named what ends it — a second specialist existing at all.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HumanReview" }
      responses:
        "204":
          description: Recorded. The case moves according to the outcome.
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: Client certificate missing or not permitted.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: This deployment drives no runs.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /internal/v1/interventions:
    get:
      operationId: listInterventions
      tags: [internal]
      security: [{ serviceMutualTls: [] }]
      summary: What is waiting for a specialist.
      description: >-
        ADR-0048 §1. PUBLISHED IN P27, having been served since P11.

        PULL, not push. "Open" is DERIVED from the store rather than from
        anything a notification did or did not deliver, so no case can be lost
        because an alert failed to send.
      responses:
        "200":
          description: Every open intervention, and nothing about any secret.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [interventions]
                properties:
                  interventions:
                    type: array
                    items: { $ref: "#/components/schemas/OpenIntervention" }
        "403":
          description: Client certificate missing or not permitted.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "503":
          description: This deployment drives no runs.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /internal/v1/interventions/{interventionId}/resolution:
    parameters:
      - name: interventionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: resolveIntervention
      tags: [internal]
      security: [{ serviceMutualTls: [] }]
      summary: A specialist adjudicates an intervention.
      description: >-
        ADR-0048 §3. PUBLISHED IN P27, having been served since P11.

        `didHappen` is the whole question: `assessIntent` stopped the run
        because it could not answer whether the action actually took effect, and
        this is the answer going back into the one place that holds it. Not a
        suggestion and not a preference — a person opened the portal and looked.

        `specialistId` is ASSERTED, not authenticated, on the same terms as the
        review above.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolutionSubmission" }
      responses:
        "200":
          description: The intervention as it now stands.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [intervention]
                properties:
                  intervention: { $ref: "#/components/schemas/OpenIntervention" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: Client certificate missing or not permitted.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already resolved. A second adjudication is not an update.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: This deployment drives no runs.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /internal/v1/conversations/{conversationId}/events:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      operationId: appendSecureEvent
      tags: [events]
      security: [{ serviceMutualTls: [] }]
      summary: The Secure Interaction Service records a lifecycle transition.
      description: >-
        ADDED AFTER THE MIGRATIONS, because writing the schema made the gap
        visible. ADR-0037 gives the two planes separate databases with separate
        credentials, so the conversation service CANNOT read `secret_requests`
        to decide whether a secure step is open — which is what the previous
        design's fail-closed guard did when both tables shared a database.

        Three ways out were considered. Deriving openness from the client's
        postMessage would make a security guard depend on a browser's word.
        Asking the secure service synchronously on every message would put a
        cross-service call in the hot path and turn its outage into a total
        conversation outage. So the secure service PUSHES each transition here,
        server to server, and the guard reads the conversation's own log —
        which is also the log the transcript, the model context and the
        post-refresh replay are all projections of.

        The student's browser still receives the transition by postMessage for
        immediate feedback. That path is a UX accelerator; this one is the
        authority.

        IDEMPOTENT on (conversationId, requestId, kind): the secure service may
        retry, and a retried transition must not appear twice in a transcript.
        A repeat returns 200 with the event already written; a first write
        returns 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppendSecureEventRequest" }
      responses:
        "201":
          description: Appended.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConversationEvent" } }
        "200":
          description: Already recorded. The event as it was first written.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConversationEvent" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: Client certificate missing or not permitted.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /internal/v1/work/claims:
    post:
      operationId: claimWork
      tags: [work]
      security: [{ serviceMutualTls: [] }]
      summary: The Automation Runner asks for something to do.
      description: >-
        ADR-0045. The runner PULLS. ADR-0037 gives it exactly one inbound port —
        a CDP endpoint reachable by the fill agent alone — so pushing work to it
        would mean a second inbound surface on the component that loads pages we
        do not control.

        The runner has no session, no cookie and no student identity. It is not
        acting for anybody; it is a component of this system doing what the
        orchestrator decided.

        204 is the ordinary answer. Most polls find nothing, because most runs
        at any instant are waiting for a student rather than for a browser, and
        a status a monitoring system reads as an error would make an idle system
        look like a broken one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimWorkRequest" }
      responses:
        "200":
          description: One unit of work, leased to this runner.
          headers:
            Cache-Control:
              schema: { type: string, enum: ["no-store"] }
              description: >-
                A lease is a capability with a deadline. Caching one would be
                caching permission to act on a student's application after it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ClaimedWork" } }
        "204":
          description: Nothing to do. A successful poll, not a failure.
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: Client certificate missing or not permitted.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: This deployment hands out no work.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /internal/v1/work/{runId}/report:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
        description: >-
          An identifier, not a capability. The capability is the `leaseId`, and
          it travels in the body — a lease in a URL would reach the Referer
          header, browser history, an access log and any shared screenshot.
    post:
      operationId: reportWork
      tags: [work]
      security: [{ serviceMutualTls: [] }]
      summary: The Automation Runner says how a unit of work ended.
      description: >-
        ADR-0045. This does NOT move the run. A report is evidence about the
        world — an account exists, a portal refused us, a browser died — and what
        a run does next is `nextStep`'s decision on the next advance. A report
        handler that set a phase would be a second implementation of that
        decision, written by the least trusted process in the system.

        An outcome of `uncertain` completes nothing: `workflow_action_intents`
        records an action with no completion, which is the recoverable form of
        "somebody acted and nobody knows what happened" (ADR-0008). A runner
        that cannot tell whether the portal accepted must report `uncertain`,
        because `failed` is a claim that nothing happened out there and only the
        runner is in a position to make it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkReport" }
      responses:
        "204":
          description: Recorded, and the lease is given back.
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: >-
            Certificate missing or not permitted, OR this caller does not hold
            the lease — it lapsed and somebody took over, or the work was
            already reported. A runner reading this stops rather than retrying.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: This deployment hands out no work.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /internal/v1/work/{runId}/documents/{documentRef}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
      - name: documentRef
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
        description: The document type the reviewed mapping named for the upload.
    post:
      operationId: handDocumentToRunner
      tags: [work]
      security: [{ serviceMutualTls: [] }]
      summary: Hand the runner one document for one upload of the work it holds — after the gates.
      description: >-
        ADR-0099. The plane checks, in order: the caller holds the lease; the
        run is at `execute` and its plan names this upload; the case carries a
        captured, un-voided authorisation and the preview the orchestrator
        would render NOW hashes to it; `authoriseDisclosure` over a record
        built from what the student saw (ADR-0022, ADR-0087, ADR-0098); and
        `mayTransmit` WITH THE CASE (ADR-0069). Only then is a sixty-second
        retrieval URL minted. Nothing on this route reads a byte.

        The lease is in the body, as on `reportWork`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkDocumentRequest" }
      responses:
        "200":
          description: The document, its retrieval URL and the disclosure record the gates ran over.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkDocument" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: >-
            Certificate missing or not permitted; the caller does not hold the
            lease; the run is not executing; no authorisation is captured; or a
            disclosure or transmission gate refused. A runner reading this
            reports the work as needing a person.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "404":
          description: No such run, or the plan names no such upload.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "409":
          description: >-
            `content_changed` — the preview no longer hashes to what the
            student authorised, or the document it named is no longer held.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: This deployment hands out no work, or has no document transport.
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

components:
  securitySchemes:
    conversationSession:
      type: apiKey
      in: cookie
      # ADR-0033. HttpOnly, Secure, SameSite=Lax, __Host- prefixed — so it is
      # bound to exactly this host and no sibling subdomain can set or read it,
      # and no script can read it at all. The secure plane holds a SEPARATE
      # cookie; a __Host- cookie cannot be shared, which is the point.
      name: __Host-conversation_session
      description: >-
        Session cookie. HttpOnly, Secure, SameSite=Lax, Path=/, no Domain.
        Unreadable by JavaScript. Issued by the conversation service after an
        OIDC authorization-code exchange (ADR-0038); the provider's own tokens
        never reach the browser.
    serviceMutualTls:
      type: mutualTLS
      description: >-
        Service-to-service, on a private subnet with no public route. Two
        certificates are permitted and each is permitted for its own endpoints
        only: the Secure Interaction Service's, for the internal append
        endpoint, and the Automation Runner's, for the work claim and report
        endpoints. Neither may reach the other's, and neither may reach any
        student-facing endpoint.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
      description: A ULID. Sortable by creation time and not guessable in sequence.
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: The run's identifier, as returned when it was started.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 128 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated, unique per logical send. A retry after a timeout
        returns the original result rather than appending a second copy of a
        student's message. Reuse with a DIFFERENT body is a conflict, not a
        replay — silently returning the first result would hide a client bug.
      schema: { type: string, minLength: 16, maxLength: 128 }

  schemas:
    Conversation:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastOrdinal]
      properties:
        id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        title:
          type: [string, "null"]
          maxLength: 200
          description: Student- or model-chosen. Ordinary free text; never a secret.
        createdAt: { type: string, format: date-time }
        lastOrdinal:
          type: integer
          minimum: 0
          description: The highest ordinal written. 0 for an empty conversation.

    ConversationPage:
      type: object
      additionalProperties: false
      required: [conversations, hasMore]
      properties:
        conversations: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
          description: >-
            What the student typed. The ONLY free-text input this service
            accepts. It is a message; it must never be a password, and the
            fail-closed guard exists because a student may type one anyway.

    # ── Events ──────────────────────────────────────────────────────────
    # A closed oneOf discriminated by `kind`. Exactly one member has a
    # `content` field. The others do not have it set to null or made optional —
    # `additionalProperties: false` means the field cannot be present at all.
    ApplicationTargetList:
      type: object
      additionalProperties: false
      required: [targets, ambiguousCount]
      properties:
        targets:
          type: array
          items: { $ref: "#/components/schemas/ApplicationTarget" }
        ambiguousCount:
          type: integer
          minimum: 0
          description: >-
            How many groups of targets share an institution, course and intake.
            A client should present those choices rather than pick one.

    ApplicationTarget:
      type: object
      additionalProperties: false
      required:
        [blueprintId, institutionName, courseName, intake, intakeRef, route,
         portalHost, requiredDocuments, needsDisambiguation]
      description: >-
        A reviewed, executable target as a person reads it. Every field comes
        from the reviewed catalogue entry; none is derived from prose.
      properties:
        blueprintId: { type: string, minLength: 1, maxLength: 128 }
        institutionName: { type: string }
        campus: { type: string }
        courseName: { type: string }
        intake:
          type: string
          description: The label, e.g. "September 2026".
        intakeRef:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          description: >-
            `YYYY-MM`. The submission identity, never a prose label.
        route:
          type: string
          description: How the application is reached — direct, partner, or assisted.
        portalHost:
          type: string
          description: >-
            The host the application is actually made against. Part of the
            identity a student must see: two reviewed targets can share
            institution, course and intake and differ only in route and portal.
        requiredDocuments:
          type: array
          items: { type: string }
        needsDisambiguation:
          type: boolean
          description: >-
            True when another reviewed target shares this one's submission
            identity, so an offer for it refuses until the student chooses.

    CreateTargetOfferRequest:
      type: object
      additionalProperties: false
      required: [blueprintId]
      properties:
        blueprintId: { type: string, minLength: 1, maxLength: 128 }
        disambiguated:
          type: boolean
          description: >-
            Set once the student has been shown the alternatives and picked this
            one. Without it, an ambiguous target refuses with 409.

    TargetOffer:
      type: object
      additionalProperties: false
      required: [offerHash, rendered, target]
      properties:
        offerHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            Binds the authenticated student, the conversation, the target's
            identity and the reviewed catalogue entry's own content hash. An
            offer made to one student in one conversation cannot be spent by
            another, or elsewhere.
        rendered:
          type: string
          description: >-
            What the student is shown, rendered deterministically from the
            target. Model-free: a model may compose prose around an offer, but
            the sentence naming what is agreed to must be reproducible.
        target: { $ref: "#/components/schemas/ApplicationTarget" }

    StartRunRequest:
      type: object
      additionalProperties: false
      required: [offerHash, studentStatement]
      properties:
        offerHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            The hash of the server-generated offer the student is accepting
            (ADR-0058, Gate 2).

            NOT a `blueprintId`. An identifier alone cannot open a case: nothing
            about receiving one proves the student was shown what it means. The
            server re-derives every candidate offer from the live catalogue and
            compares, so possession of a hash is never sufficient — a retired
            target, changed reviewed content, another student's offer or another
            conversation's offer all refuse.
        studentStatement:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the student actually said. Becomes the case's request evidence.

    ConversationRun:
      type: object
      additionalProperties: false
      required: [runId, caseId, conversationId, status, phase, step, revision, resumed]
      description: >-
        Position and identity. Four closed-set words, three identifiers and a
        number — there is no free-text field on this schema at all, which also
        means there is no field into which a future change could interpolate a
        value.
      properties:
        runId: { type: string, minLength: 1, maxLength: 128 }
        caseId: { type: string, minLength: 1, maxLength: 128 }
        conversationId: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        status: { $ref: "#/components/schemas/RunStatus" }
        phase: { $ref: "#/components/schemas/RunPhase" }
        step: { $ref: "#/components/schemas/RunStepKind" }
        revision:
          type: integer
          minimum: 0
          description: Optimistic-concurrency revision of the durable checkpoint.
        resumed:
          type: boolean
          description: True when the call resumed an existing run rather than creating one.

    RunPreview:
      type: object
      additionalProperties: false
      required: [contentHash, hashAlgorithm, presentedText]
      description: >-
        ADR-0059. Exactly what will be submitted, in the words the student
        reads, and the hash their authorisation names.

        This is the ONE schema in this document that carries the student's own
        data in plain text, and it is deliberate: a redacted preview cannot be
        checked, so the control is not redaction but WHERE the plaintext is
        allowed to go. It goes to the student. It is served `no-store`, is not
        persisted, and its body is not logged. It still cannot carry a secret —
        a credential field appears in the application as a field that WILL be
        filled by the Secure Plane, never as a value.
      properties:
        contentHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            Over the canonical content of the preview. This is what the student
            sends back with an `authorise` decision, and what the run driver
            re-derives and compares before recording anything.
        hashAlgorithm: { type: string, const: sha256 }
        presentedText:
          type: string
          description: >-
            The complete application, field by field, in the order the portal
            asks — including every value that will be sent, any document that
            will be attached, and anything the student will complete themselves.

            Deterministic and model-free: `renderPreview` is a pure function of
            the preview, so what a student agreed to is reproducible from the
            data rather than from whatever a model happened to say.

            Complete on purpose. There is no "and 14 other fields", because a
            summary is not what they are authorising.
          maxLength: 200000

    PendingDecision:
      type: object
      additionalProperties: false
      required: [decision, contentHash]
      description: >-
        ADR-0061. What the run is waiting for the student to do, and the hash
        that decision must carry.

        Published because one of these hashes cannot be computed by a client at
        all: `confirm_handoff` is over a message the ORCHESTRATOR renders, not
        over anything in the conversation log, so a client could only produce
        it by re-implementing that rendering and then guessing which message in
        the transcript it applied to. Publishing all three keeps one rule
        rather than one rule and two exceptions.

        `cancel` is deliberately absent. It is available at every step and
        carries no hash (ADR-0053), so it is not something a run waits for — a
        client offers it always, not because a read said so.
      properties:
        decision:
          type: string
          enum: [confirm_value, authorise, confirm_handoff]
          description: >-
            The `kind` to send to the decision route. A subset of
            `StudentDecisionKind`: the three that are PROMPTED.
        contentHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            From the same source the decision route compares against — the open
            proposal's playback hash, the preview's content hash, or the hash
            of the handover message the orchestrator would render now.

            For `authorise` this is the same value `GET .../runs/{runId}/preview`
            returns; the preview route is how the student reads WHAT they are
            authorising, and this is how a client knows that it must.

    StudentDecision:
      description: >-
        ADR-0049 §5. What only the student can decide, and about exactly what.

        A discriminated union rather than one object with optional fields: three
        of the four members REQUIRE the hash of what was shown, and an optional
        field would let a caller omit it.
      oneOf:
        - $ref: "#/components/schemas/HashedStudentDecision"
        - $ref: "#/components/schemas/CancelDecision"

    HashedStudentDecision:
      type: object
      additionalProperties: false
      required: [kind, contentHash]
      properties:
        kind:
          type: string
          enum: [authorise, confirm_handoff, confirm_value]
        contentHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            The hash of what the student was shown when they were asked —
            the preview for `authorise`, the handover message for
            `confirm_handoff`, the deterministic playback for `confirm_value`.
            Confirming something they can no longer see is confirming something
            else, so a mismatch is refused rather than recorded.

    CancelDecision:
      type: object
      additionalProperties: false
      required: [kind]
      description: >-
        ADR-0053. No hash, and that is not an inconsistency: requiring one would
        mean a student could stop only immediately after the system had spoken,
        and a stop button that works only while the system is talking is not a
        stop button. What a cancellation establishes — that this student asked
        to stop — is carried by the authenticated session it arrives on.
      properties:
        kind: { type: string, const: cancel }

    RunStatus:
      type: string
      enum: [running, suspended, uncertain, escalated, completed, abandoned]

    RunPhase:
      type: string
      enum:
        - preparing_inputs
        - interviewing
        - awaiting_specialist
        - awaiting_secret
        - creating_account
        - awaiting_student_handoff
        - awaiting_authorisation
        - filling
        - ready_to_submit
        - handing_over

    RunStepKind:
      type: string
      description: >-
        The KIND of the orchestrator's decision, never its contents.
      enum:
        - interview
        - specialist
        - fix_content
        - authorise
        - execute
        - create_account
        - request_secret
        - student_handoff
        - ready_to_submit
        - hand_over_account
        - sign_in

    ConversationEvent:
      oneOf:
        - { $ref: "#/components/schemas/MessageEvent" }
        - { $ref: "#/components/schemas/SecretRequestedEvent" }
        - { $ref: "#/components/schemas/SecretReceivedEvent" }
        - { $ref: "#/components/schemas/SecretSettledEvent" }
        - { $ref: "#/components/schemas/SecretRejectedEvent" }
        - { $ref: "#/components/schemas/ValueAskedEvent" }
        - { $ref: "#/components/schemas/ValueProposedEvent" }
        - { $ref: "#/components/schemas/ValueConfirmedEvent" }
        - { $ref: "#/components/schemas/ValueRejectedEvent" }
        - { $ref: "#/components/schemas/TargetOfferedEvent" }
        - { $ref: "#/components/schemas/TargetRequestedEvent" }
        - { $ref: "#/components/schemas/ReapplicationAdvisedEvent" }
      discriminator:
        propertyName: kind
        mapping:
          message: "#/components/schemas/MessageEvent"
          secret_requested: "#/components/schemas/SecretRequestedEvent"
          secret_received: "#/components/schemas/SecretReceivedEvent"
          secret_consumed: "#/components/schemas/SecretSettledEvent"
          secret_expired: "#/components/schemas/SecretSettledEvent"
          secret_cancelled: "#/components/schemas/SecretSettledEvent"
          secret_rejected: "#/components/schemas/SecretRejectedEvent"
          value_asked: "#/components/schemas/ValueAskedEvent"
          value_proposed: "#/components/schemas/ValueProposedEvent"
          value_confirmed: "#/components/schemas/ValueConfirmedEvent"
          value_rejected: "#/components/schemas/ValueRejectedEvent"
          target_offered: "#/components/schemas/TargetOfferedEvent"
          target_requested: "#/components/schemas/TargetRequestedEvent"
          reapplication_advised: "#/components/schemas/ReapplicationAdvisedEvent"

    ReapplicationAdvisedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, priorCaseId, priorOutcome, advice]
      description: >
        The system advised on a second application, and said what it advised
        (ADR-0006 rule 4).

        Content-free, like the other two structured exchanges: the words the
        student read are an ordinary assistant message beside this. What this
        carries is the record that makes the instruction acceptable — an
        instruction with no advice before it is refused.
      properties:
        kind: { type: string, enum: [reapplication_advised] }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        priorCaseId: { type: string }
        priorOutcome: { $ref: "#/components/schemas/PriorOutcome" }
        advice: { type: string, enum: [next_intake, six_months, none] }
        suggestedIntake:
          type: string
          description: Present only with `next_intake`.

    TargetOfferedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, offerHash, targetBlueprintId, targetContentHash]
      description: >
        The server resolved a REVIEWED application target and put it to the
        student (ADR-0058).

        Content-free: the prose the student reads is an ordinary message beside
        this, and what this carries is the identity that prose describes.
        `targetContentHash` is the reviewed catalogue entry's own content hash
        (ADR-0057), recorded rather than re-derived so a later change to the
        artefact is detectable instead of silently reinterpreted.
      properties:
        kind: { type: string, enum: [target_offered] }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        offerHash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        targetBlueprintId: { type: string, minLength: 1, maxLength: 128 }
        targetContentHash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }

    TargetRequestedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, offerHash]
      description: >
        The student explicitly asked to apply to exactly the offer `offerHash`
        names — the first consequential act in the journey, and the event
        immediately before the case is opened.

        It names the offer and nothing else. What was offered is the offer's to
        state, and repeating it here would let two rows disagree about one fact.
      properties:
        kind: { type: string, enum: [target_requested] }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        offerHash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }

    ValueProposedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, fieldKey, proposal, playbackHash]
      description: >
        A reading the agent understood from what the student said, and the
        deterministic playback it was shown as (ADR-0051).

        NOT a fact about the application. It is a fact about the conversation —
        this is what we understood and this is what we showed you — and it
        becomes a fact about the application only when the student agrees, at
        which point it lives in the confirmed profile.
      properties:
        kind: { type: string, enum: [value_proposed] }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        fieldKey: { type: string }
        proposal:
          description: >
            The structured reading. Its shape belongs to the profile package and
            is deliberately not described here: this document is the wire
            contract, and a second description of a type would be a second
            place for it to drift.
        playbackHash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }

    ValueConfirmedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, fieldKey, playbackHash]
      description: >
        The student agreed to exactly the reading `playbackHash` names. The
        value itself is in the confirmed profile; nothing about it is repeated
        here.
      properties:
        kind: { type: string, enum: [value_confirmed] }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        fieldKey: { type: string }
        playbackHash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }

    ValueAskedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, fieldKey]
      description: >
        The service put a question about this field to the student (ADR-0062).
        The words they read are the assistant message beside it; this carries
        no prose, so the log can answer "is a question outstanding?" without
        reading any. It carries no hash either: nothing is confirmed against a
        question — what the student agrees to is the reading, later.
      properties:
        kind: { type: string, enum: [value_asked] }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        fieldKey: { type: string }

    ValueRejectedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, fieldKey]
      description: >
        The student did not agree. The exchange closes without writing
        anything; what they say next is a fresh answer.
      properties:
        kind: { type: string, enum: [value_rejected] }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        fieldKey: { type: string }

    MessageEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, actor, content]
      properties:
        kind: { type: string, const: message }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        actor: { type: string, enum: [student, assistant, mentor, system] }
        content:
          type: [string, "null"]
          maxLength: 8000
          description: >-
            null when the body has been redacted by an erasure request or the
            retention policy. The event survives so ordinals stay dense and the
            transcript keeps its shape (ADR-0031).
        redactedAt: { type: string, format: date-time }

    SecretRequestedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, requestId, channel, expiresAt]
      description: >-
        The model asked for a secret. Content-free by construction. The prompt's
        title, explanation and portal host are NOT here: the Secure Interaction
        Service holds them and renders them inside its own document on its own
        origin, so this plane never receives text a model wrote about a password.
      properties:
        kind: { type: string, const: secret_requested }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        requestId: { $ref: "#/components/schemas/SecretRequestId" }
        channel: { type: string, enum: [secure_control] }
        expiresAt: { type: string, format: date-time }

    SecretReceivedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, requestId, handle]
      properties:
        kind: { type: string, const: secret_received }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        requestId: { $ref: "#/components/schemas/SecretRequestId" }
        handle:
          $ref: "#/components/schemas/SecretHandle"

    SecretSettledEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, requestId]
      description: A terminal transition. Which request, and nothing else.
      properties:
        kind: { type: string, enum: [secret_consumed, secret_expired, secret_cancelled] }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        requestId: { $ref: "#/components/schemas/SecretRequestId" }

    SecretRejectedEvent:
      type: object
      additionalProperties: false
      required: [kind, ordinal, createdAt, requestId, reason]
      description: >-
        An attempt failed. A rejection does NOT close the request: the step stays
        open so the student can retry, and only a lifecycle transition closes it.
      properties:
        kind: { type: string, const: secret_rejected }
        ordinal: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        requestId: { $ref: "#/components/schemas/SecretRequestId" }
        reason: { $ref: "#/components/schemas/RejectionReason" }

    ClaimWorkRequest:
      type: object
      additionalProperties: false
      required: [holder, sessions]
      description: >-
        Who is asking, for how long, and which runs it is signed in to. ADR-0045,
        ADR-0101 §2.
      properties:
        holder:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Which runner. An identifier for an operator reading the lease table
            during an incident — never a credential, and never used for
            authorisation. The client certificate does that.
        sessions:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
          description: >-
            The runs this runner holds a signed-in browser context for, in
            memory, for at most five minutes idle (ADR-0101 §2). `execute` work
            is handed only to a runner that names the run here — a fill needs
            the session the account was created in — and a runner that names it
            is preferred for it. `create_account` work needs no session. Empty
            is the ordinary value for a runner that has just started.
        leaseSeconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 120
          description: >-
            Clamped by the server, not trusted from the request. The lease
            duration is the Application Plane's risk and not the runner's: a
            runner that asked for an hour would be a runner that could strand a
            student's application for an hour by crashing.

    ClaimedWork:
      type: object
      additionalProperties: false
      required:
        [leaseId, expiresAt, runId, caseId, studentRef, kind, portalHost, email, approach]
      description: >-
        One unit of browser work. Read the fields, then read what is absent:
        there is no password, no profile, no fill value, no document and no
        database credential. The runner is the component that loads pages we do
        not control, and every one of those would be a thing a compromised
        page's process could go looking for.
      properties:
        leaseId:
          type: string
          description: >-
            Proof this runner is the holder. Regenerated on every claim
            INCLUDING a takeover, so a runner that was superseded while it
            worked cannot close out work the new holder is in the middle of.
        expiresAt:
          type: string
          format: date-time
          description: When the lease lapses and the run becomes claimable again.
        runId: { type: string }
        caseId: { type: string }
        studentRef: { type: string, format: uuid }
        kind:
          type: string
          enum: [create_account, sign_in, execute]
          description: >-
            `create_account` carries `registration`; `sign_in` carries `login`
            and a `secretHandle` (ADR-0101 §3, the resume path); `execute`
            carries `plan` and `formUrl`. Each kind carries what it needs and
            refuses the other shape, so an `execute` item with registration
            targets and no plan is rejected at the boundary rather than
            half-executed.
        portalHost:
          type: string
          description: The host the account is being created on. Bound, not a suggestion.
        email:
          type: string
          format: email
          description: The student's own address. The account being created is theirs (ADR-0020).
        approach:
          type: string
          enum: [passwordless, student_chosen, portal_issued, generated_ephemeral]
        secretHandle:
          type: string
          pattern: "^sh_[0-9a-f]{32}$"
          description: >-
            An OPAQUE reference to the password the student typed into the
            secure control — no plaintext, no length, nothing derived from it
            (ADR-0026). Present only when one exists and the portal needs it.
            The runner hands it to the Secure Plane's fill agent, which resolves
            it there; the runner holds no vault, has no KMS grant and has no
            certificate that could reach one (ADR-0042).
        registration:
          $ref: "#/components/schemas/RegistrationTargets"
        login:
          $ref: "#/components/schemas/LoginTargets"
        plan:
          $ref: "#/components/schemas/TransportedPlan"
        formUrl:
          type: string
          format: uri
          description: >-
            The page the plan's fields are on. Must be on `portalHost`; the
            runner re-checks rather than trusting it.
        advanceLocator:
          allOf: [{ $ref: "#/components/schemas/WorkLocator" }]
          description: >-
            The control that SAVES this page. A portal keeps nothing until the
            page is saved, so a runner that stopped at the last field would
            report success over an application the university has no record of.

            Not the submit control, and it cannot become one: the runner's click
            guard admits exactly the locators it is given (ADR-0014).
        repeat:
          type: object
          additionalProperties: false
          required: [index, count]
          description: >-
            Present when the page is filled once per item of a list (ADR-0103,
            gap 3): which item this fill is, of how many, and the control that
            opens a fresh entry on the page. The runner presses `addAnother`
            after landing and before typing; `advanceLocator` saves this one
            item; the next item comes as the next unit of work.
          properties:
            index:
              type: integer
              minimum: 0
            count:
              type: integer
              minimum: 1
            addAnother:
              $ref: "#/components/schemas/WorkLocator"

    TransportedPlan:
      type: object
      additionalProperties: false
      required: [blueprintId, blueprintVersion, mappingSetId, instructions]
      description: >-
        A fill plan, taken apart for transport (ADR-0046). A `ConfirmedValue`
        cannot survive a wire, so each value crosses as its text plus the
        provenance the student's confirmation produced, and is reassembled
        through the one mint that may produce one.

        No `handoffs`, no `blockers` — a plan that has either is REFUSED for
        transport rather than trimmed. `uploads` cross as REFERENCES (ADR-0099):
        which box, which document the reviewed mapping named, where the box is
        — and no bytes, no document id, no hash. The runner asks for each one
        with `handDocumentToRunner`, and is answered only after the disclosure
        gates have run with the case.
      properties:
        blueprintId: { type: string }
        blueprintVersion: { type: string }
        mappingSetId: { type: string }
        instructions:
          type: array
          items: { $ref: "#/components/schemas/TransportedInstruction" }
          description: >-
            May be empty where the page carries only uploads — a documents page
            (P74). A plan with neither instructions nor uploads is refused by
            the parser on both sides.
        uploads:
          type: array
          items: { $ref: "#/components/schemas/TransportedUpload" }

    TransportedUpload:
      type: object
      additionalProperties: false
      required: [fieldRef, label, documentRef, locators]
      description: An upload as a reference. Exactly these four; a plane that sent more is refused.
      properties:
        fieldRef: { type: string }
        label: { type: string }
        documentRef: { type: string, description: The document type the reviewed mapping named. }
        locators:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WorkLocator" }

    WorkDocumentRequest:
      type: object
      additionalProperties: false
      required: [leaseId, holder]
      properties:
        leaseId: { type: string }
        holder: { type: string }

    WorkDocument:
      type: object
      additionalProperties: false
      required: [documentId, documentType, contentHash, contentType, retrieval, disclosure]
      description: >-
        One document, for one upload of the work the runner holds — handed over
        only after `authoriseDisclosure` and `mayTransmit` ran on the plane with
        the case (ADR-0099). The runner hashes what it fetches, re-runs both
        gates over `disclosure`, and refuses any mismatch before attaching.
      properties:
        documentId: { type: string }
        documentType: { type: string }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        contentType: { type: string }
        retrieval:
          type: object
          additionalProperties: false
          required: [url, method, expiresAt]
          properties:
            url: { type: string, format: uri, description: A short-lived GET the plane minted. HTTPS only. }
            method: { type: string, enum: [GET] }
            expiresAt: { type: string, format: date-time }
        disclosure: { $ref: "#/components/schemas/WireDisclosure" }

    WireDisclosure:
      type: object
      additionalProperties: false
      required: [disclosureId, subject, destination, determinationId, studentAuthorisation]
      description: >-
        The disclosure record the plane's gate ran. The determination travels
        as its ID — the runner holds the same register in code and refuses one
        it does not hold. `presentedText` is the preview the student
        authorised, verbatim (ADR-0098).
      properties:
        disclosureId: { type: string }
        subject:
          type: object
          additionalProperties: false
          required: [documentId, documentType, contentHash, caseId, requestedFor]
          properties:
            documentId: { type: string }
            documentType: { type: string }
            contentHash: { type: string }
            caseId: { type: string }
            requestedFor: { type: string }
        destination:
          type: object
          additionalProperties: false
          required: [institutionName, portalHost]
          properties:
            institutionName: { type: string }
            portalHost: { type: string }
            processorName: { type: string }
        determinationId: { type: string }
        studentAuthorisation:
          type: object
          additionalProperties: false
          required: [studentRef, presentedText, authorisedAt, method]
          properties:
            studentRef: { type: string }
            presentedText: { type: string }
            authorisedAt: { type: string, format: date-time }
            method: { type: string, enum: [chat_affirmation, signed_form, specialist_recorded] }

    TransportedInstruction:
      type: object
      additionalProperties: false
      required: [fieldRef, label, inputType, locators, value]
      properties:
        fieldRef: { type: string }
        label: { type: string }
        inputType: { type: string }
        locators:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WorkLocator" }
        value: { $ref: "#/components/schemas/TransportedValue" }

    TransportedValue:
      oneOf:
        - $ref: "#/components/schemas/TransportedConfirmedValue"
        - $ref: "#/components/schemas/TransportedReviewedConstant"
      discriminator:
        propertyName: kind
        mapping:
          confirmed: "#/components/schemas/TransportedConfirmedValue"
          reviewed_constant: "#/components/schemas/TransportedReviewedConstant"

    TransportedConfirmedValue:
      type: object
      additionalProperties: false
      required: [kind, fieldKey, text, provenance]
      description: >-
        A value the student confirmed, with the confirmation that made it one.
        `provenance` is REQUIRED: without it the far side has text and nothing
        to rebuild from, and the only way to produce a value would be to invent
        a provenance — an assertion that a student said something, made by a
        process with no idea whether they did.
      properties:
        kind: { type: string, enum: [confirmed] }
        fieldKey: { type: string }
        text: { type: string }
        provenance: { $ref: "#/components/schemas/TransportedProvenance" }

    TransportedReviewedConstant:
      type: object
      additionalProperties: false
      required: [kind, text, rationale, mappingSetId, reviewedBy]
      description: >-
        Not the student's data, and it stays distinguishable from their data all
        the way to the keyboard — `executePlan` calls `fill` for one and
        `fillConstant` for the other, and no provenance is fabricated for either.
      properties:
        kind: { type: string, enum: [reviewed_constant] }
        text: { type: string }
        rationale: { type: string }
        mappingSetId: { type: string }
        reviewedBy: { type: string }

    TransportedProvenance:
      type: object
      additionalProperties: false
      required: [source, confirmedAt]
      properties:
        source:
          type: string
          enum: [student_stated, student_entered, document_extracted, student_corrected]
        confirmedAt: { type: string, format: date-time }
        sourceExcerpt:
          type: string
          description: The student's own words, where the value came from conversation.
        documentId:
          type: string
          description: Document ID only — never the document, and never its contents.

    RegistrationTargets:
      type: object
      additionalProperties: false
      required: [url, emailLocator, passwordLocators, submitLocator]
      description: >-
        Where the form is and which boxes to type into. Blueprint facts only —
        a URL, three or four selectors, and a control to press. The reviewed
        blueprint stays in the Application Plane's catalogue; two copies would
        be two things to keep in step, and the one in the runner would be the
        one nobody reviewed.
      properties:
        url:
          type: string
          format: uri
          description: >-
            Must be on `ClaimedWork.portalHost`. The runner re-checks rather
            than trusting it: a URL pointing somewhere else would be an
            instruction to create an account on a host nobody bound the work to.
        emailLocator: { $ref: "#/components/schemas/WorkLocator" }
        passwordLocators:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/WorkLocator" }
          description: >-
            Every password box on the form, in order. One secret fills all of
            them in a single use of one handle — the student is asked once.
        submitLocator: { $ref: "#/components/schemas/WorkLocator" }

    LoginTargets:
      type: object
      additionalProperties: false
      required: [url, emailLocator, passwordLocator, submitLocator]
      description: >-
        Where the login form is and which boxes to type into — the resume path
        (ADR-0101 §3). The same rules as `RegistrationTargets`: blueprint facts
        only, on the bound host. ONE password box, because a login asks once
        and a second locator would be a second guess about where a credential
        goes.
      properties:
        url:
          type: string
          format: uri
          description: Must be on `ClaimedWork.portalHost`. The runner re-checks.
        emailLocator: { $ref: "#/components/schemas/WorkLocator" }
        passwordLocator: { $ref: "#/components/schemas/WorkLocator" }
        submitLocator: { $ref: "#/components/schemas/WorkLocator" }

    WorkLocator:
      type: object
      additionalProperties: false
      required: [strategy, value]
      description: >-
        How the blueprint names a field. The same shape the fill agent's own
        contract uses, and the freest text in this payload — reviewed blueprint
        data rather than model output.
      properties:
        strategy: { type: string, enum: [label, placeholder, name, id, css, role] }
        value: { type: string }

    WorkReport:
      type: object
      additionalProperties: false
      required: [leaseId, outcome]
      description: >-
        How a unit of work ended. There is no free-text field, deliberately: a
        portal's error message is written by a site that can put anything in it,
        and this is a durable record in a plane that site should not be able to
        write to.
      properties:
        leaseId: { type: string }
        outcome:
          type: string
          enum: [succeeded, failed, uncertain]
        failure:
          type: string
          enum:
            [
              portal_drift,
              portal_refused,
              already_exists,
              secret_unavailable,
              needs_the_student,
              runner_fault,
              captcha_met,
              second_factor_met,
            ]
          description: >-
            Required exactly when the outcome is not `succeeded`, and refused
            when it is. A half-written report reads as more or less certainty
            than the runner actually had.

            `captcha_met` and `second_factor_met` (ADR-0101 §6) are the two the
            plane STOPS a run on, naming which was met: a portal asked for
            something the plan assumed absent and only a person can pass. They
            are never re-offered as work.
        transmissions:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/WireTransmission" }
          description: >-
            Every document the runner attached to the page it saved (ADR-0069,
            P73). Accepted only with `succeeded`: an attachment on a page that
            was not saved is a disclosure that did not happen. Each names the
            box, the document and its hash — the identity of the
            `attach_document` intent the plane opened at the claim — so a report
            can settle exactly the attachments it made and no other.

    WireTransmission:
      type: object
      additionalProperties: false
      required: [fieldRef, disclosureId, documentId, contentHash, toHost, institutionName, caseId, transmittedAt]
      description: >-
        One document that left, as the audit trail records it: identifiers and
        a hash, never contents. Produced by the executor at the moment of
        attaching, not reconstructed afterwards.
      properties:
        fieldRef: { type: string }
        disclosureId: { type: string }
        documentId: { type: string }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        toHost: { type: string }
        institutionName: { type: string }
        caseId: { type: string }
        transmittedAt: { type: string, format: date-time }

    AppendSecureEventRequest:
      type: object
      additionalProperties: false
      required: [kind, requestId]
      description: >-
        A secure lifecycle transition. There is deliberately no `content`,
        `actor`, `title` or `explanation` member: `kind` is restricted to the
        secure kinds, and the conversation database's CHECK constraints refuse
        a body or an actor on any of them regardless of what is sent.
      properties:
        kind:
          type: string
          enum:
            - secret_requested
            - secret_received
            - secret_consumed
            - secret_expired
            - secret_cancelled
            - secret_rejected
        requestId: { $ref: "#/components/schemas/SecretRequestId" }
        handle: { $ref: "#/components/schemas/SecretHandle" }
        reason: { $ref: "#/components/schemas/RejectionReason" }
        channel: { type: string, enum: [secure_control] }
        expiresAt: { type: string, format: date-time }

    EventPage:
      type: object
      additionalProperties: false
      required: [events, hasMore]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/ConversationEvent" } }
        hasMore: { type: boolean }

    SecretRequestId:
      type: string
      pattern: "^sr_[0-9a-f]{32}$"
      description: An identifier, not a capability. On its own it authenticates nobody.

    SecretHandle:
      type: string
      pattern: "^sh_[0-9a-f]{32}$"
      description: >-
        Opaque, random rather than derived, single-use, and bound to student,
        case, purpose and target — re-checked when it is spent. The only
        capability permitted to cross into this plane. It resolves to nothing
        outside a live vault, so a handle in a transcript is inert.

    RejectionReason:
      type: string
      description: A code, never a sentence. Wording is chosen at render time.
      enum:
        - confirmation_mismatch
        - empty
        - unknown_request
        - expired
        - already_submitted
        - not_your_request
        - wrong_conversation
        - endpoint_unreachable
        - prompt_expired
        - client_does_not_support_secure_control
        - insecure_context
        - unknown_channel

    # ── Errors ──────────────────────────────────────────────────────────
    # RFC 9457 problem+json, MINUS `detail`. See src/problems.ts for why: a
    # per-occurrence human-readable string is the field into which a helpful
    # handler interpolates the thing that was wrong, and on a password
    # endpoint the thing that was wrong is the password.
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, instance]
      properties:
        type: { type: string, format: uri }
        title:
          type: string
          description: A FIXED string per code. Never derived from the request.
        status: { type: integer }
        code: { $ref: "#/components/schemas/ProblemCode" }
        instance:
          type: string
          description: The request id, for correlating with logs.

    ValidationProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [pointers]
          properties:
            pointers:
              type: array
              description: >-
                JSON Pointers to the fields that failed. Locations, never values —
                a message would eventually contain what was found there.
              items: { type: string, pattern: "^/" }

    SecretRequestOpenProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [requestId, expiresAt]
          properties:
            requestId: { $ref: "#/components/schemas/SecretRequestId" }
            expiresAt: { type: string, format: date-time }

    RateLimitedProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [retryAfterSeconds]
          properties:
            retryAfterSeconds: { type: integer, minimum: 0 }

    PriorOutcome:
      type: string
      description: >-
        What the STUDENT says happened to their previous application. A claim
        with its provenance in the type, never a fact this system established
        (ADR-0006, brief §2.8).
      enum: [rejected, withdrawn]

    WaitRecommendation:
      type: object
      additionalProperties: false
      required: [priorCaseId, advice, rationale, shownAt]
      description: >-
        What the system advised before accepting an instruction to apply again.
        Advisory in effect, mandatory in presentation (ADR-0006 rules 4 and 5).
      properties:
        priorCaseId:
          type: string
          description: The concluded application a second attempt would follow.
        advice:
          type: string
          description: >-
            `none` is a real answer rather than an absence: it records that the
            circumstances did not warrant advising a wait, which is a different
            fact from never having advised at all.
          enum: [next_intake, six_months, none]
        suggestedIntake:
          type: string
          description: >-
            Present only with `next_intake`. This deployment does not currently
            produce one — naming a later intake means knowing one is open, which
            is a catalogue listing question, and advising a student to wait for
            an intake nobody has reviewed would be inventing a fact.
        rationale:
          type: string
          description: >-
            The plain-language reasoning the student read. Composed by
            `recommendWait` from the advice; never assembled from a request.
        shownAt: { type: string, format: date-time }

    AlreadyApplyingProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [existingCaseId, concluded]
          properties:
            existingCaseId:
              type: string
              description: >-
                The application already holding this submission identity. Always
                one of the CALLER'S OWN — the student is part of the identity,
                so a collision cannot be with anybody else's case.
            concluded:
              type: boolean
              description: >-
                True when that application has finished, so a second attempt may
                be instructed through `POST .../reapplication`.

    ProblemCode:
      type: string
      enum:
        - unauthenticated
        - forbidden
        - not_found
        - validation_failed
        - unsupported_media_type
        - payload_too_large
        - idempotency_key_conflict
        - intervention_already_resolved
        - content_changed
        - content_hash_mismatch
        - intake_not_open
        - upload_not_received
        - document_not_retainable
        - document_basis_undetermined
        - document_type_refused
        - secret_request_open
        - already_applying
        - specialist_reviewing
        - email_not_verified
        - rate_limited
        - internal_error
        - service_unavailable

    DocumentUploadDeclaration:
      type: object
      additionalProperties: false
      required: [documentType, contentType, contentHash, sizeBytes]
      properties:
        documentType:
          type: string
          description: >-
            A supported document type. `national_id` is NOT one — it was removed
            in ADR-0089, and re-adding it requires the DPA 2018 Sch. 1
            appropriate policy document to exist first.
        purpose:
          type: string
          description: >-
            Why it is held. Keys the storing activity's determination
            (ADR-0087). OPTIONAL, and the student's page never sends it: the
            purpose is the controller's decision, made per schedule row, not
            the student's. When omitted the governing schedule supplies the
            one purpose it holds for the type; a type with none or several
            answers 400 on `/purpose` and the caller must state one. A stated
            purpose is judged by the gates exactly as before.
        contentType: { type: string }
        contentHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the bytes about to be sent, lowercase hex.
        sizeBytes: { type: integer, minimum: 1 }

    DocumentIntake:
      type: object
      additionalProperties: false
      required:
        [intakeId, expiresAt, upload, maxBytes, acceptedContentTypes, contentHash, retentionPolicyReference]
      properties:
        intakeId: { type: string }
        expiresAt: { type: string, format: date-time }
        upload: { $ref: "#/components/schemas/PreparedUpload" }
        maxBytes:
          type: integer
          description: The ceiling for THIS document type. Stated, not guessed at.
        acceptedContentTypes:
          type: array
          items: { type: string }
        contentHash:
          type: string
          description: The hash the bytes must match. Echoed so a client can check its own.
        retentionPolicyReference:
          type: string
          description: >-
            The retention policy the gate actually resolved — not a claim that
            one exists. A client can put this in front of a person.

    PreparedUpload:
      type: object
      additionalProperties: false
      description: >-
        A pre-signed PUT to the bucket, bound to the declared SHA-256. The
        signature covers `headers`, so the browser must send every one of them
        exactly: omitting or altering any is refused by the bucket
        (ADR-0092 §4, E6 and E7). The URL is useless without them, and it is
        never minted unbound (ADR-0093).
      required: [url, method, headers, expiresAt]
      properties:
        url: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
          description: >-
            `x-amz-checksum-sha256` (base64 of the declared digest) and the two
            SSE-KMS headers. Send them as given.
        expiresAt: { type: string, format: date-time }

    StoredDocument:
      type: object
      additionalProperties: false
      required:
        [documentId, documentType, state, contentHash, contentType, sizeBytes, uploadedAt, retentionPolicyReference]
      properties:
        documentId: { type: string }
        documentType: { type: string }
        state: { type: string }
        contentHash: { type: string }
        contentType:
          type: string
          description: The DECLARED content type. The upload URL does not sign it (ADR-0093).
        sizeBytes: { type: integer, minimum: 1 }
        uploadedAt: { type: string, format: date-time }
        retentionPolicyReference: { type: string }

    HeldDocuments:
      type: object
      additionalProperties: false
      required: [documents, documentTypes]
      description: >-
        What this student holds, and what they can be given. Read on every
        draw of the page and after every confirm, so the page never remembers
        a document it was told about (ADR-0060).
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/StoredDocument" }
        documentTypes:
          type: array
          items: { type: string }
          description: >-
            The document types the governing retention schedule has a row for.
            What the page offers as a choice — not a promise the gates pass it:
            a type whose determination was decided against (ADR-0088) is
            listed and refused at declaration, in the gate's words.

    SecureStepBootstrap:
      type: object
      additionalProperties: false
      required: [requestId, frameToken, secureOrigin, expiresAt]
      description: >-
        What a page needs to mount the secure frame, and nothing else. ADR-0033.
      properties:
        requestId: { type: string }
        frameToken:
          type: string
          description: >-
            Single-use, short-lived, and exchanged by the secure origin for its
            own `__Host-` cookie. A CAPABILITY, not a secret of the student's —
            which is why it may appear in this response at all, while the
            secure document marks its own copy writeOnly so no generator emits
            it there. It is never put in a URL (see the `no capability travels
            in a URL` guard).
        secureOrigin:
          type: string
          description: >-
            Where the frame is loaded from, and the origin the page checks every
            postMessage against. Never `*`.
        expiresAt: { type: string, format: date-time }

    HumanReview:
      type: object
      additionalProperties: false
      required: [reviewerId, outcome, triggers]
      description: >-
        A specialist's review of a case that a mandatory trigger stopped.
      properties:
        reviewerId:
          type: string
          description: >-
            A named individual, never a shared account — ASSERTED on the
            internal credential rather than authenticated (ADR-0048 §3).
        outcome: { type: string, enum: [approved, rejected, changes_requested] }
        triggers:
          type: array
          minItems: 1
          description: >-
            Which triggers this review clears. At least one: a review that
            cleared nothing would leave the case exactly where it was.
          items:
            type: string
            enum:
              - financial_evidence
              - involves_minor
              - low_confidence
              - conflicting_information
              - stale_requirement_data
              - blueprint_drift
              - unexpected_portal_behaviour
              - information_unobtainable
        notes: { type: string }

    OpenIntervention:
      type: object
      additionalProperties: false
      required:
        - interventionId
        - runId
        - caseId
        - studentRef
        - priority
        - reason
        - action
        - target
        - portal
        - phase
        - encountered
        - expected
        - raisedAt
        - announced
      description: >-
        One open intervention, as a specialist reads it. A PROJECTION, not the
        record: the stored context and the resolution's prose stay on the
        server, and nothing shaped like a position is here to be honoured by a
        caller (ADR-0048 §5).
      properties:
        interventionId: { type: string }
        runId: { type: string }
        caseId: { type: string }
        studentRef: { type: string }
        priority: { type: string, description: "`high` or `critical`." }
        reason: { type: string }
        action: { type: string, description: The consequential action in flight. }
        target:
          type: string
          description: What it acted on — a portal host, a page reference. Never a value.
        portal: { type: string }
        phase: { type: string }
        encountered: { type: string, description: In the words a specialist can act on. }
        expected: { type: string }
        raisedAt: { type: string, format: date-time }
        announced: { type: boolean, description: Whether the student has been told. }

    ResolutionSubmission:
      type: object
      additionalProperties: false
      required:
        - specialistId
        - actionsTaken
        - resolution
        - outcome
        - didHappen
        - scope
        - kind
        - signature
      description: >-
        What a specialist submits. Deliberately absent from every field: the
        intervention's id, the run, the resolution time and any position. They
        are not read, so they cannot become authoritative.
      properties:
        specialistId:
          type: string
          description: ASSERTED, not authenticated (ADR-0048 §3).
        actionsTaken: { type: string }
        resolution: { type: string }
        outcome: { type: string, enum: [resume, abandon] }
        didHappen:
          type: boolean
          description: >-
            The whole question. `assessIntent` stopped the run because it could
            not answer whether the action took effect; this is a person having
            opened the portal and looked.
        scope: { type: string, description: How widely the fix applies. Narrow by default. }
        kind: { type: string }
        signature: { type: string }

  responses:
    Unauthenticated:
      description: No valid session cookie.
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    NotFound:
      description: >-
        Not found, or not the caller's. The same answer for both: distinguishing
        them would confirm the existence of another student's conversation.
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    ValidationFailed:
      description: The request did not satisfy the schema.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
    SecretRequestOpen:
      description: >-
        A secure step is open on this conversation. Nothing was persisted,
        nothing reached the model, and nothing from the body is echoed here.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/SecretRequestOpenProblem" }
    IdempotencyKeyConflict:
      description: The key was already used with a different request body.
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    PayloadTooLarge:
      description: Body above the route's limit.
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    UnsupportedMediaType:
      description: >-
        A charset or a Content-Encoding this service will not decode. NOT
        simply "not application/json", which was what this said until P41 and
        was never what the parser did: a body sent as text/plain is skipped
        rather than refused, and the route then names the missing field.
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RateLimitedProblem" }
